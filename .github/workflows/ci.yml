name: EduSense AI CI - Backend & PostgreSQL Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  unit-tests:
    name: Fast Unit Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Fast Unit Tests
        run: |
          pytest -v -rs --ignore=tests/test_postgresql_integration.py

  postgres-integration-tests:
    name: Database Integration & Triggers (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: edusense_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edusense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PostgreSQL Database Connection & Safety
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/edusense_test
        run: |
          python -c "
          import os
          from urllib.parse import urlparse
          from sqlalchemy import create_engine, text

          url = os.getenv('TEST_DATABASE_URL')
          dbname = urlparse(url).path.lstrip('/')
          assert 'test' in dbname.lower(), f'Safety violation: {dbname} is not a test database'

          engine = create_engine(url, connect_args={'connect_timeout': 5})
          with engine.connect() as conn:
              ver = conn.execute(text('SELECT version();')).scalar()
              print(f'Connected to PostgreSQL: {ver}')
          "

      - name: Run Clean Alembic Migrations against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/edusense_test
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/edusense_test
        run: |
          alembic upgrade head

      - name: Run PostgreSQL Integration Tests & Verify Zero Skips
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/edusense_test
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/edusense_test
        run: |
          pytest tests/test_postgresql_integration.py -v -rs --cov=app --cov-report=term-missing
