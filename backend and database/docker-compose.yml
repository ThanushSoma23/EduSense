version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: edusense_postgres_test
    restart: always
    environment:
      POSTGRES_DB: edusense_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edusense_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
